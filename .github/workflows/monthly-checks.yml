name: monthly checks

# Once a month: has a source behind the page changed, and does the CBS data
# still pass the pipeline's checks? Can also be started by hand from the Actions tab.
on:
  schedule:
    - cron: "17 6 1 * *"   # the 1st of every month, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # the source check opens or updates one issue when a source changed

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "requests>=2.31,<3"
      # Compares with data/nitrogen/source_state.json as it is on main.
      # Exit code 3 (an issue could not be opened) fails the job, and GitHub sends an e-mail.
      - name: Ask the sources and compare with the saved state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/nitrogen/check_sources.py --issue

  cbs-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      # Fetches CBS and runs every check of the pipeline; stores nothing.
      - name: Fetch CBS and run the checks
        run: python pipeline/cbs_livestock.py --dry-run